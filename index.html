<html lang="th"><head><meta charset="utf-8">

<title>Medieval Village Prototype</title>
<style>
:root{--bg:#0b0e14;--fg:#e8dcc0;--ac:#c9a15b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Noto Serif Thai',serif;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;z-index:0;inset:0;width:100%;height:100%}
#btn{position:fixed;z-index:5;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#1b1610cc;color:var(--ac);border:1px solid var(--ac);padding:5px 9px;font:inherit;font-size:12px;border-radius:6px}
#shopBtn{position:fixed;z-index:5;right:12px;top:calc(env(safe-area-inset-top,0px) + 44px);width:38px;height:38px;padding:0;font-size:20px;line-height:1;background:#1b1610cc;border:1px solid var(--ac);border-radius:6px;-webkit-tap-highlight-color:transparent}
#shopBtn.open{background:var(--ac)}
#shop{display:none;position:fixed;inset:0;z-index:25;align-items:center;justify-content:center;background:#000a;padding:16px;box-sizing:border-box;touch-action:none}
.sp{width:min(340px,92vw);max-height:90vh;overflow:auto;touch-action:pan-y;box-sizing:border-box;background:linear-gradient(#241b12f2,#140f0af2);border:2px solid var(--ac);border-radius:10px;padding:16px;text-align:center;box-shadow:0 4px 22px #000,inset 0 0 0 3px #0008;text-shadow:0 1px 3px #000}
.sp-h{display:flex;justify-content:space-between;align-items:center;color:var(--ac);font-size:18px}
.sp-x{background:none;border:1px solid var(--ac);color:var(--ac);border-radius:6px;font:inherit;width:34px;height:34px;padding:0}
.sp-coin{text-align:right;font-size:13px;margin-top:4px;color:#f1d38a}
.sp-card{margin:10px 0 12px;border:1px solid #c9a15b88;border-radius:8px;padding:12px;background:#0b0e14aa}
.sp-art{font-size:68px;line-height:1.1;filter:drop-shadow(0 0 14px #ff6a20)}
.sp-name{color:var(--ac);font-size:17px;margin:4px 0}
.sp-desc{font-size:13px;line-height:1.5;opacity:.9}
.sp-tags{margin-top:8px;font-size:12px;color:#ffcf7a}
.sp-price{margin-top:8px;font-size:16px;color:#f1d38a;min-height:1.4em}
#shopBuy{width:100%;padding:12px;font:inherit;font-size:16px;background:var(--ac);color:#1b1610;border:0;border-radius:6px}
#shopBuy.own{background:#3a3226;color:#9a8f78}
#joy,.sk{display:none}
@media (pointer:coarse){
#joy{display:block;position:fixed;z-index:5;left:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);width:130px;height:130px;border-radius:50%;background:#1b161066;border:2px solid #c9a15b88}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#c9a15bcc;box-shadow:0 2px 8px #000a}
.sk{display:block;position:fixed;z-index:5;border-radius:50%;background:#1b1610d9;color:var(--ac);border:2px solid var(--ac);font:inherit;font-size:26px;padding:0;box-shadow:0 2px 10px #000a;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden;touch-action:none}
.sk::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000c calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
#atk{right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:96px;height:96px;font-size:38px;border-color:#e0553f;background:#5a1a12e6}
#dashBtn{right:136px;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);width:64px;height:64px;font-size:26px}
}
#shout{position:fixed;text-shadow:0 1px 4px #000}
#shout{z-index:7;top:28%;left:50%;transform:translateX(-50%);font-size:28px;white-space:pre-line;max-width:90vw;font-weight:bold;color:#ffcf7a;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#dismountBtn{right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 232px);width:56px;height:56px;font-size:22px}
/* ปุ่ม E ลอยตามตัวมังกร (World-to-Screen) — กดค้าง ~0.55 วิ เพื่อขึ้นขี่ */
#dragonE{position:fixed;z-index:6;left:0;top:0;width:54px;height:54px;margin:0;padding:0;border-radius:50%;display:none;transform:translate(-50%,-50%);--p:0%;border:1.5px solid rgba(214,176,92,.55);background:rgba(27,22,16,.45);color:#fff;font:700 22px system-ui,sans-serif;opacity:.82;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 4px #000}
#dragonE::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(rgba(255,214,120,.95) var(--p),rgba(255,255,255,.12) 0);-webkit-mask:radial-gradient(circle,transparent 30px,#000 31px);mask:radial-gradient(circle,transparent 30px,#000 31px);pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,#0004 100%)}
@media (pointer:coarse){
body.riding #flyui{flex-direction:row!important;gap:14px!important;right:135px!important;bottom:calc(env(safe-area-inset-bottom,0px) + 45px)!important}
}
#xhair{position:fixed;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border:2px solid #ff7a20;border-radius:50%;box-shadow:0 0 10px #ff5a10,0 0 22px #ff5a1099,inset 0 0 10px #ff5a1066;pointer-events:none;display:none}
#xhair::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#ffd070;box-shadow:0 0 8px #ff8a20}
body.firing #xhair{display:block;animation:xhp .35s ease-in-out infinite alternate}
@keyframes xhp{from{transform:translate(-50%,-50%) scale(.9)}to{transform:translate(-50%,-50%) scale(1.12)}}
</style></head><body>

 <button id="shopBuy"></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V3=THREE.Vector3,R=(a,b)=>a+Math.random()*(b-a);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),SKY=0xb9d6ea;   // ท้องฟ้ายามเช้า
scene.background=new THREE.Color(SKY);scene.fog=new THREE.FogExp2(0xd6dfe0,0.0016);
const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.08,1500);cam.near=.08;cam.updateProjectionMatrix();   // near เล็ก กันแขน/อก/อานแหว่งใกล้เลนส์ตอนมุมมองที่ 1
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// ---------- helpers ----------
function tex(c,v,rep,w=128){const k=document.createElement('canvas');k.width=k.height=w;const g=k.getContext('2d');g.fillStyle=c;g.fillRect(0,0,w,w);
 for(let i=0;i<2200;i++){g.fillStyle=Math.random()<.6?`rgba(0,0,0,${Math.random()*v})`:`rgba(255,255,255,${Math.random()*v*.4})`;g.fillRect(Math.random()*w,Math.random()*w,2,2)}
 const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.encoding=THREE.sRGBEncoding;return t}
const M=(c,r=.9,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},x));
const wood=M(0x4a3222),plaster=M(0xa58f68),roofM=M(0x4a2a1e),stone=M(0x6a675f,1),dark=M(0x1a120c),skin=M(0xc79a78);
const box=(w,h,d,m,x,y,z,p=scene)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const cyl=(rt,rb,h,s,m,x,y,z,p=scene)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const col=[];

// ---------- lights & sky ----------
const hemi=new THREE.HemisphereLight(0xcfe4ff,0x6a5a3c,0.95);scene.add(hemi);
const moon=new THREE.DirectionalLight(0xffdca8,1.7)   // แสงอาทิตย์ยามเช้า (ใช้ชื่อตัวแปร moon เดิม);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);
Object.assign(moon.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:200});moon.shadow.bias=-0.0006;
scene.add(moon,moon.target);
const moonMesh=new THREE.Mesh(new THREE.SphereGeometry(14,16,16),new THREE.MeshBasicMaterial({color:0xfff0c4,fog:false}));moonMesh.position.set(240,170,-300);scene.add(moonMesh);
{const p=[];for(let i=0;i<600;i++){const a=R(0,6.28),b=R(.15,1.4);p.push(Math.cos(a)*Math.cos(b)*380,Math.sin(b)*380,Math.sin(a)*Math.cos(b)*380)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 var starM=new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:0});var starP=new THREE.Points(g,starM);starP.frustumCulled=false;scene.add(starP)}

// ---------- terrain: grass, river, road ----------
const OFF=600,RZ=-OFF,VX=70,VZ1=46,VZ2=172,GW=6,PZ=100,WZ=108;let _sg=null;
function beginShift(){_sg=new THREE.Group();_sg.position.z=-OFF;scene.add(_sg);const g=_sg;scene.add=o=>g.add(o);col.push=(...a)=>a.forEach(c=>Array.prototype.push.call(col,[c[0],c[1]-OFF,c[2]]))}
function endShift(){delete scene.add;delete col.push}
const grassT=tex('#2c3a22',.5,60,128),grass=M(0xffffff,1,{map:grassT});
{const ZA=RZ-140,ZB=VZ2+70,LZ=ZB-ZA,t=grassT.clone();t.needsUpdate=true;t.repeat.set(160,LZ*.2);const g=new THREE.Mesh(new THREE.PlaneGeometry(800,LZ),M(0xffffff,1,{map:t}));g.rotation.x=-Math.PI/2;g.position.set(0,0,(ZA+ZB)/2);g.receiveShadow=true;scene.add(g)}   // พื้นหญ้าผืนเดียวคลุมทั้งแมป
// ---------- objects ----------
function wallLine(x1,z1,x2,z2,hmin,hmax,m,skip=0){const dx=x2-x1,dz=z2-z1,n=Math.ceil(Math.hypot(dx,dz)/1.8);
 for(let i=0;i<=n;i++){if(Math.random()<skip)continue;const x=x1+dx*i/n,z=z1+dz*i/n,h=R(hmin,hmax);
  const o=box(1.9,h,1.1,m,x,h/2,z);o.rotation.y=-Math.atan2(dz,dx);o.rotation.z=R(-.04,.04);col.push([x,z,1])}}
function house(x,z,ry,w,d){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
 box(w,3,d,plaster,0,1.5,0,g);
 [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(.26,3.1,.26,wood,a*w/2,1.55,b*d/2,g));
 [1.6,2.9].forEach(y=>[-1,1].forEach(s=>box(w+.05,.18,.12,wood,0,y,s*d/2,g)));
 const gg=new THREE.ConeGeometry(.7071,1,4);gg.rotateY(Math.PI/4);
 const r=new THREE.Mesh(gg,roofM);r.scale.set(w+1.2,2.6,d+1.2);r.position.y=4.3;r.castShadow=true;g.add(r);
 box(.9,.9,.9,stone,w/3,4.4,0,g);
 box(1,2.1,.1,dark,0,1.05,d/2+.05,g);
 box(.8,.7,.1,M(0x000000,.5,{emissive:0xffa040,emissiveIntensity:1.4}),w/3,1.9,d/2+.05,g);
 g.updateMatrixWorld(true);chim.push(g.localToWorld(new V3(w/3,5,0)));col.push([x,z,Math.max(w,d)/2+.3])}
// ---------- REALISTIC HERO MODEL (Lathe Anatomy + Layered Tunic + Physics Cape) ----------
function civMats(c){
 if(man.civ)return man.civ;
 const W=256,hx=x=>'#'+new THREE.Color(x).getHexString(),sh=(x,t)=>hx(new THREE.Color(x).lerp(new THREE.Color(t>0?0xffffff:0),Math.abs(t)));
 const cv=()=>{const k=document.createElement('canvas');k.width=k.height=W;return[k,k.getContext('2d')]};
 const TX=(k,srgb)=>{const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;return t};
 const rp=(t,x,y)=>{const q=t.clone();q.repeat.set(x,y);q.needsUpdate=true;return q};
 const weave=(base,hi,lo,gray,stitch)=>{const[k,g]=cv();g.fillStyle=base;g.fillRect(0,0,W,W);const n=64,s=W/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i+j)%2){g.fillStyle=hi;g.fillRect(i*s,j*s+.6,s-.4,s-1.2)}else{g.fillStyle=lo;g.fillRect(i*s+.6,j*s,s-1.2,s-.4)}}
  for(let i=0;i<2200;i++){g.fillStyle=Math.random()<.5?'rgba(0,0,0,.09)':'rgba(255,255,255,.07)';g.fillRect(R(0,W),R(0,W),R(1,4),1)}
  g.lineWidth=gray?3:2;g.strokeStyle=gray?'rgba(0,0,0,.42)':'rgba(0,0,0,.18)';
  for(let i=0;i<12;i++){const x=R(0,W),y=R(0,W);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+R(-40,40),y+R(10,40),x+R(-60,60),y+R(30,80));g.stroke()}
  if(stitch){g.fillStyle=gray?'#ffffff':'#d8b46c';for(let x=0;x<W;x+=14)g.fillRect(x+2,W/2-16,8,32)}
  return k};
 const skinCv=gray=>{const[k,g]=cv();g.fillStyle=gray?'#8c8c8c':'#cfa07c';g.fillRect(0,0,W,W);
  if(!gray)for(let i=0;i<40;i++){const x=R(0,W),y=R(0,W),r=R(28,75),q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,i%2?'rgba(195,105,82,.14)':'rgba(120,78,48,.11)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(x-r,y-r,2*r,2*r)}
  for(let i=0;i<1800;i++){g.fillStyle=gray?'rgba(40,40,40,.5)':'rgba(120,70,45,.18)';g.beginPath();g.arc(R(0,W),R(0,W),R(.5,1.5),0,6.283);g.fill()}
  return k};
 const leatherCv=gray=>{const[k,g]=cv();g.fillStyle=gray?'#808080':'#3e2415';g.fillRect(0,0,W,W);
  for(let i=0;i<900;i++){const r=R(2,5);g.beginPath();g.ellipse(R(0,W),R(0,W),r,r*R(.6,1),R(0,3.14),0,6.283);g.fillStyle=gray?'rgba(255,255,255,.28)':'rgba(110,70,42,.22)';g.fill();g.lineWidth=1.2;g.strokeStyle=gray?'rgba(0,0,0,.6)':'rgba(15,8,3,.38)';g.stroke()}
  return k};
 const hairCv=gray=>{const[k,g]=cv();g.fillStyle=gray?'#808080':'#2b1b10';g.fillRect(0,0,W,W);
  for(let i=0;i<460;i++){const x=R(0,W),v=R(0,1),w=R(1,2.4),q=v>.5?230:30;g.strokeStyle=gray?`rgba(${q},${q},${q},.55)`:`rgba(${(32+v*55)|0},${(20+v*34)|0},${(10+v*20)|0},.9)`;g.lineWidth=w;g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+R(-6,6),W*.33,x+R(-6,6),W*.66,x+R(-4,4),W);g.stroke()}
  return k};
 const std=(map,bump,rx,ry,bs,r,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:0xffffff,map:rp(map,rx,ry),bumpMap:rp(bump,rx,ry),bumpScale:bs,roughness:r},x));
 const PC=0x2a2725,CC=0x5c1916,
  tfC=TX(weave(hx(c),sh(c,.15),sh(c,-.22),0),1),tfB=TX(weave('#707070','#c4c4c4','#4a4a4a',1)),
  hmC=TX(weave(sh(c,.08),sh(c,.2),sh(c,-.1),0,1),1),hmB=TX(weave('#808080','#d0d0d0','#555555',1,1)),
  pnC=TX(weave(hx(PC),sh(PC,.14),sh(PC,-.25),0),1),pnB=TX(weave('#707070','#c4c4c4','#4a4a4a',1)),
  cpC=TX(weave(hx(CC),sh(CC,.16),sh(CC,-.25),0),1),cpB=TX(weave('#707070','#c4c4c4','#4a4a4a',1)),
  skC=TX(skinCv(0),1),skB=TX(skinCv(1)),lhC=TX(leatherCv(0),1),lhB=TX(leatherCv(1)),hrC=TX(hairCv(0),1),hrB=TX(hairCv(1));
 return man.civ={
  skin:std(skC,skB,2,2,.55,.68),skinD:M(0xb57c5e,.78),
  tunic:std(tfC,tfB,3,2,1.2,.9),sleeve:std(tfC,tfB,2,2,1.2,.9),hem:std(hmC,hmB,10,1,1.2,.88),
  pants:std(pnC,pnB,2,3,1.2,.94),
  cape:std(cpC,cpB,2,3,1.3,.92,{side:THREE.DoubleSide}),
  leather:std(lhC,lhB,2,2,1.5,.74),leatherDS:std(lhC,lhB,6,1,1.5,.74,{side:THREE.DoubleSide}),cord:std(lhC,lhB,1,1,1,.8,{color:0xc9a27a}),
  sole:M(0x18100a,.9),brass:M(0xc9a248,.3,{metalness:.75}),steel:M(0x8a929e,.35,{metalness:.7}),
  hair:std(hrC,hrB,2,2,1.4,.82),brow:M(0x22140a,.9),lip:M(0x9e5b52,.48),
  eyeW:M(0xf4f1ea,.2),iris:M(0x3a5248,.25),pupil:M(0x050505,.2),glint:new THREE.MeshBasicMaterial({color:0xffffff}),dark:M(0x0a0a0c,1)
 }}

function manCiv(c,s=1){
 const g=new THREE.Group(),root=new THREE.Group(),hips=new THREE.Group();g.add(root);hips.position.y=.95;root.add(hips);
 const GC=man.G||(man.G={}),K=civMats(c),PI=Math.PI;
 const G=(T,...a)=>{const k=T+a;return GC[k]||(GC[k]=new THREE[T+'Geometry'](...a))};
 const Lathe=(k,pts,seg=20)=>{if(GC[k])return GC[k];const v=new THREE.SplineCurve(pts.map(([r,y])=>new THREE.Vector2(r,y))).getPoints(24);return GC[k]=new THREE.LatheGeometry(v,seg)};
 const ob=(geo,m,x,y,z,p,sh=1)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=!!sh;p.add(o);return o};

 // ---- 1. ลำตัวทรงนักรบสมส่วน (LatheGeometry ไร้รอยต่อ: เอวคอด-อกผาย-บ่ากว้าง) ----
 const torso=new THREE.Group();torso.position.y=.03;hips.add(torso);
 const torsoGeo=Lathe('heroTorso',[[.19,0],[.205,.12],[.22,.26],[.255,.42],[.275,.55],[.22,.63],[.09,.67]],22);
 ob(torsoGeo,K.tunic,0,0,0,torso).scale.set(1.18,1,.76);
 ob(G('Sphere',.23,18,12),K.tunic,0,.57,0,torso,0).scale.set(1.32,.48,.82); // บ่าและไหปลาร้า

// ---------- NEW EARTH WYVERN MODEL (PRO V2: SLEEK PREDATOR BODY, CONTINUOUS SCALES, FORWARD-LEVELED HEAD) ----------
function wyvernTex(mode){
 const S=512,cv=document.createElement('canvas');cv.width=cv.height=S;
 const g=cv.getContext('2d'),r=(sd=>()=>((sd=(sd*1664525+1013904223)>>>0)/4294967296))(mode==='bump'?77:mode==='lava'?99:44);
 // เกล็ดขนาดละเอียดเรียงถี่ขึ้น (18 แถว) เพื่อให้ต่อเนื่องกับปล้องคอและหาง
 const rad=24,dy=S/18;
 if(mode==='bump'){
  g.fillStyle='#242424';g.fillRect(0,0,S,S);
  for(let y=-1;y<20;y++)for(let x=-1;x<13;x++){
   const cx=x*2*rad+(y&1?rad:0),cy=y*dy+rad*.45;
   const gr=g.createRadialGradient(cx,cy-rad*.3,2,cx,cy,rad*1.05);
   gr.addColorStop(0,'#f4f4f4');gr.addColorStop(.72,'#828282');gr.addColorStop(1,'#181818');
   g.fillStyle=gr;g.beginPath();g.moveTo(cx-rad,cy-rad*.55);g.lineTo(cx+rad,cy-rad*.55);g.lineTo(cx+rad*.76,cy+rad*.5);g.lineTo(cx,cy+rad*.9);g.lineTo(cx-rad*.76,cy+rad*.5);g.closePath();g.fill();
   g.strokeStyle='#090909';g.lineWidth=1.8;g.stroke();
  }
 }else if(mode==='lava'){
  g.fillStyle='#050100';g.fillRect(0,0,S,S);
  for(let y=-1;y<20;y++)for(let x=-1;x<13;x++){
   if(r()>.42)continue;
   const cx=x*2*rad+(y&1?rad:0),cy=y*dy+rad*.45;
   g.strokeStyle=r()<.35?'#ffb224':'#ff4206';g.lineWidth=1.4+r()*1.4;
   g.beginPath();g.moveTo(cx-rad*.76,cy+rad*.5);g.lineTo(cx,cy+rad*.9);g.lineTo(cx+rad*.76,cy+rad*.5);g.stroke();
  }
 }else{
  g.fillStyle='#1c1815';g.fillRect(0,0,S,S);
  for(let y=-1;y<20;y++)for(let x=-1;x<13;x++){
   const cx=x*2*rad+(y&1?rad:0),cy=y*dy+rad*.45,moss=r()<.22;
   const gr=g.createRadialGradient(cx,cy-rad*.3,2,cx,cy,rad*1.1);
   if(moss){gr.addColorStop(0,'#536e38');gr.addColorStop(1,'#27351a')}
   else{const v=(56+r()*20)|0;gr.addColorStop(0,`rgb(${v+18},${v+13},${v+8})`);gr.addColorStop(1,`rgb(${v-18},${v-20},${v-22})`)}
   g.fillStyle=gr;g.beginPath();g.moveTo(cx-rad,cy-rad*.55);g.lineTo(cx+rad,cy-rad*.55);g.lineTo(cx+rad*.76,cy+rad*.5);g.lineTo(cx,cy+rad*.9);g.lineTo(cx-rad*.76,cy+rad*.5);g.closePath();g.fill();
   g.strokeStyle='#0b0806';g.lineWidth=1.5;g.stroke();
  }
 }
 const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;
 if(mode!=='bump'){if(THREE.SRGBColorSpace)t.colorSpace=THREE.SRGBColorSpace;else t.encoding=THREE.sRGBEncoding}
 return t;
}
const wyvTex=(m,rx,ry)=>{const t=wyvernTex(m);t.repeat.set(rx,ry);return t};

 const head=new THREE.Group();head.position.set(0,-.01,-.32);NJ[NJ.length-1].add(head);P.head=head;

 for(const s of[-1,1]){

 {const LT=new THREE.MeshStandardMaterial({color:0x5c381c,bumpMap:wyvTex('bump',2,2),bumpScale:.8,roughness:.78}),

function updateEarthWyvern(dt,t){
 const s=Math.sin(t*1.5),P=wyvP;
 P.torso.scale.set(1+.014*s,1+.026*s,1+.014*s);P.torso.position.y=.05+1*P.torso.scale.y;
 P.neck.rotation.x=.14+.03*s;
 let sumX=P.neck.rotation.x;
 P.neckJ.forEach((j,i)=>{
  const rx=BASE_WYV_NECK[i]+.018*Math.sin(t*1.5-i*.55);
  j.rotation.x=rx;
  sumX+=rx;
 });
 // เงยหัวเชิดขึ้นรับกับลำคอในท่า Idle (ไม่กดหัวลง)
 P.head.rotation.x=-sumX*0.35+0.14+0.04*s;
 P.tail.rotation.x=.08*s;
 P.wingL.rotation.z=.03*s;P.wingR.rotation.z=-.03*s;
}
